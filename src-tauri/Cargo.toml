[package]
name = "filemanageclient"
version = "0.3.7"
description = "FileManage 云盘式文件管理器客户端"
authors = ["mon"]
edition = "2021"

[lib]
name = "filemanageclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 0.3.0 tray-icon 特性启用 tauri::tray 系统托盘（tray-icon/muda/libappindicator 已在
# 锁文件与本地缓存，Linux 运行时 dlopen ayatana-appindicator3-0.1，无编译链接依赖）
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
# 0.3.3 增 process：ffmpeg 转码通路（player.rs）以 tokio::process::Command 起子进程
tokio = { version = "1", features = ["fs", "macros", "io-util", "time", "process", "sync"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "2"
# 0.2.1 网格缩略图缩放（仅解码常见光栅图 + JPEG 编码；无默认重型特性）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# 0.3.2 目录重传校验：本地文件流式 SHA-256（与服务端 fileops.SHA256File 同算法可互比；
# 已是锁内传递依赖 0.10.9，提为直接依赖零新下载）
sha2 = "0.10"

# 0.3.0 需求2：单实例——托盘隐藏后重复启动只唤起已有窗口（仅桌面端）。
# 钉 ~2.4.5：2.5.x 要求 tauri ^2.12（当前锁 2.11.5）且 MSRV 1.90，build-env 镜像
# 的 stable 版本不可控；2.4.5 依赖的 tauri ^2.10/zbus 均已在现有锁与缓存内。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "~2.4.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
