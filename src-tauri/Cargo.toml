[package]
name = "filemanageclient"
version = "0.1.6"
description = "FileManage 云盘式文件管理器客户端"
authors = ["mon"]
edition = "2021"

[lib]
name = "filemanageclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["fs", "macros", "io-util", "time"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
